<style>
/* Layout: summary first (stage, waiting on, next), then the stage track, then sessions, features, decisions, roadmap changes */
:root {
  --bg: #f4f5f7; --surface: #ffffff; --ink: #1c2230; --muted: #5d6576; --line: #dde1e8;
  --accent: #3d4fb8; --accent-soft: #e8ebfa;
  --ok: #23704a; --ok-soft: #e1f2e8; --review: #8a5a00; --review-soft: #fbf0d9; --work: #3d4fb8; --work-soft: #e8ebfa;
  --idle: #6b7280; --idle-soft: #eef0f3; --block: #a33a3a; --block-soft: #f8e4e4;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c; --surface: #1a1f29; --ink: #e6e9f0; --muted: #9aa2b2; --line: #2c3342;
    --accent: #9aa8f5; --accent-soft: #252c4a;
    --ok: #7fd1a3; --ok-soft: #173326; --review: #f0c46b; --review-soft: #3a2e14; --work: #9aa8f5; --work-soft: #252c4a;
    --idle: #9aa2b2; --idle-soft: #232936; --block: #f19a9a; --block-soft: #3d1f22; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151c; --surface: #1a1f29; --ink: #e6e9f0; --muted: #9aa2b2; --line: #2c3342;
  --accent: #9aa8f5; --accent-soft: #252c4a;
  --ok: #7fd1a3; --ok-soft: #173326; --review: #f0c46b; --review-soft: #3a2e14; --work: #9aa8f5; --work-soft: #252c4a;
  --idle: #9aa2b2; --idle-soft: #232936; --block: #f19a9a; --block-soft: #3d1f22; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 68rem; margin: 0 auto; padding-block: 2.5rem 4rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 2rem; }
.wrap > *, .cols > * { min-width: 0; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0.5rem 1.5rem; }
h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 600; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.meta { color: var(--muted); font-size: 0.85rem; }
h2 { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0 0 0.75rem; }
.id { font-family: var(--mono); font-size: 0.85em; color: var(--muted); font-variant-numeric: tabular-nums; }
a { color: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap: 1rem; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.1rem; display: grid; gap: 0.5rem; align-content: start; min-width: 0; }
.panel .big { font-size: 1.35rem; font-weight: 600; }
.panel ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.5rem; }
.panel li { display: grid; gap: 0.1rem; }
.worked { font-size: 1.1rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.worked:empty { display: none; }
.who { font-weight: 600; }
.why { color: var(--muted); font-size: 0.85rem; }

.track { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.5rem; }
.step { display: grid; gap: 0.35rem; }
.step b { font-size: 0.85rem; font-weight: 600; }
.step .bar { height: 6px; border-radius: 3px; background: var(--idle-soft); overflow: hidden; }
.step .bar i { display: block; height: 100%; background: var(--ok); }
.step.current b { color: var(--accent); }
.step.current .bar { outline: 2px solid var(--accent-soft); }
.step .n { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
@media (max-width: 560px) { .track { grid-template-columns: repeat(auto-fit, minmax(5.5rem, 1fr)); } }

.scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
th, td { text-align: left; padding: 0.6rem 0.8rem; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tr.stage-row td { background: var(--bg); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding-block: 0.4rem; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill { display: inline-block; font-size: 0.75rem; font-weight: 500; padding: 0.1rem 0.55rem; border-radius: 999px; white-space: nowrap; }
.s-locked, .s-verified { background: var(--ok-soft); color: var(--ok); }
.s-in-review { background: var(--review-soft); color: var(--review); }
.s-in-progress, .s-built { background: var(--work-soft); color: var(--work); }
.s-todo, .s-planned { background: var(--idle-soft); color: var(--idle); }
.s-decided { background: var(--accent-soft); color: var(--accent); }
.s-blocked { background: var(--block-soft); color: var(--block); }
.type { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); }
.over { color: var(--block); }
.big.bad { color: var(--block); }
.big.good { color: var(--ok); }
.tcount { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
.tcount.none { color: var(--block); }

.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: 2rem; }
.rows { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.rows li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 0.75rem; align-items: baseline; padding: 0.55rem 0.8rem; border-bottom: 1px solid var(--line); }
.rows li:last-child { border-bottom: 0; }
.rows.feat li { grid-template-columns: auto minmax(0, 1fr) auto auto; }
.rows.plain li { grid-template-columns: minmax(0, 1fr); }
.coverage { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--idle-soft); margin-bottom: 0.75rem; }
.coverage i { display: block; }
.empty { color: var(--muted); font-size: 0.9rem; background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 1rem; }
</style>

<div class="wrap">
  <header>

  <section aria-labelledby="h-changes" id="changes-wrap"><h2 id="h-changes">Roadmap changes</h2><div id="changes"></div></section>
</div>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
function el(tag, attrs = {}, kids = []) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (v == null) continue; if (k === 'text') n.textContent = v; else n.setAttribute(k, v); }
  for (const k of [].concat(kids)) if (k != null) n.append(k);
  return n;
}

const mins = m => (m == null ? '' : m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`);
const empty = text => el('p', { class: 'empty', text });

$('project').textContent = D.project;
$('meta').textContent = `${D.mode === 'solo' ? 'Solo' : 'Approver: ' + D.approvers.join(', ')} · Updated ${fmt(D.generatedAt)}`;
if (D.preview) $('meta').append(' · ', el('a', { href: D.preview.url, target: '_blank', rel: 'noopener', title: D.preview.branch, text: 'Open the latest preview' }));

const locked = D.sessions.filter(s => s.status === 'locked').length;
$('stage').textContent = D.current === 'done' ? 'Delivered' : LABEL[D.current] || 'Ideate';
$('stage-note').textContent = D.sessions.length
  ? `${locked} of ${D.sessions.length} sessions locked · ${D.decisions.count} decisions`
  : 'No roadmap yet. Run /ideate, then /plan.';
if (D.time.sessions) $('worked').textContent = `${D.time.approx ? '~' : ''}${mins(D.time.total)} worked · ${D.time.sessions} session${D.time.sessions === 1 ? '' : 's'}`;

if (D.waiting.length) $('waiting').append(...D.waiting.map(w => el('li', {}, [
  el('span', {}, [el('span', { class: 'who', text: w.on }), ' ', pill(w.why === 'review' ? 'in review' : 'in progress', w.why)]),
  el('span', { class: 'why' }, [el('span', { class: 'id', text: '#' + w.n }), ' ' + w.name + ' ', w.url ? el('a', { href: w.url, target: '_blank', rel: 'noopener', text: 'Open board' }) : null]),
])));
else $('waiting').append(el('li', { class: 'why', text: 'Nothing open.' }));

$('next').append(D.next

$('tests-note').textContent = [

$('track').append(...D.stages.map(s => el('div', { class: 'step' + (s.key === D.current ? ' current' : '') }, [
  el('b', { text: s.label }),

  el('span', { class: 'n', text: s.total ? `${s.locked}/${s.total}` : '—' }),
])));

if (D.sessions.length) {
  const body = el('tbody');
  let stage = null;
  for (const s of D.sessions) {
    if (s.stage !== stage) { stage = s.stage; body.append(el('tr', { class: 'stage-row' }, [el('td', { colspan: '7', text: LABEL[stage] || stage })])); }
    const blocked = s.status === 'todo' && s.waiting?.why?.startsWith('blocked');
    body.append(el('tr', {}, [
      el('td', { class: 'num' }, [el('span', { class: 'id', text: '#' + s.n })]),
      el('td', {}, [s.name, s.features.length ? el('div', { class: 'id', text: s.features.join(' ') }) : null]),
      el('td', {}, [el('span', { class: 'type', text: s.type })]),
      el('td', {}, [blocked ? pill('blocked', s.waiting.why) : pill(s.status)]),
      el('td', { text: s.approver }),

  const order = ['verified', 'built', 'decided', 'planned'];
  const counts = Object.fromEntries(order.map(k => [k, D.features.filter(f => f.status === k).length]));
  const color = { verified: 'var(--ok)', built: 'var(--work)', decided: 'color-mix(in srgb, var(--accent) 45%, transparent)', planned: 'transparent' };
  $('features').append(
    el('div', { class: 'coverage', role: 'img', 'aria-label': order.map(k => `${counts[k]} ${k}`).join(', ') }, order.map(k => el('i', { style: `width:${(100 * counts[k]) / D.features.length}%;background:${color[k]}` }))),
    el('ul', { class: 'rows feat' }, D.features.map(f => el('li', {}, [
      el('span', { class: 'id', text: f.id }),
      el('span', {}, [f.name, f.priority !== 'must' ? el('span', { class: 'why', text: ' · ' + f.priority }) : null]),
      el('span', { class: 'tcount' + (!f.tests && ['built', 'verified'].includes(f.status) ? ' none' : ''), text: f.tests ? `${f.tests} test${f.tests === 1 ? '' : 's'}` : ['built', 'verified'].includes(f.status) ? 'no tests' : '' }),
      pill(f.status),
    ]))),
  );
} else $('features').append(empty('Features appear once /ideate writes docs/idea.md.'));

$('decisions').append(D.decisions.recent.length
  ? el('ul', { class: 'rows' }, D.decisions.recent.map(d => el('li', {}, [el('span', { class: 'id', text: d.id }), el('span', { text: d.title }), el('span', { class: 'why', text: d.date })])))
  : empty('No decisions locked yet.'));

if (D.fixes?.length) $('fixes').append(el('ul', { class: 'rows plain' }, D.fixes.map(c => el('li', { text: c }))));
else $('fixes-wrap').hidden = true;
if (D.report) $('meta').append(' · ', el('a', { href: D.report, target: '_blank', rel: 'noopener', text: 'Report a problem' }));
if (D.changes.length) $('changes').append(el('ul', { class: 'rows plain' }, D.changes.map(c => el('li', { text: c }))));
else $('changes-wrap').hidden = true;
</script>

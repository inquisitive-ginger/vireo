name: release
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, packages: write }

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, dockerfile: apps/api/Dockerfile }
          - { name: web, dockerfile: apps/shell/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3 # arm64 emulation (api image only; web builds native)
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          tags: |
            ghcr.io/inquisitive-ginger/family-os-${{ matrix.name }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/inquisitive-ginger/family-os-{0}:latest', matrix.name) || '' }}

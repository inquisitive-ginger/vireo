name: deploy
on:
  workflow_run:
    workflows: [release]
    types: [completed]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, linux, ARM64]
    steps:
      # The pull relied on a docker login done by hand at Pi setup; the Pi 5
      # migration (2026-08-16) didn't carry it over and the first deploy died
      # unauthorized. The job's GITHUB_TOKEN already has Packages: read.
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Pull the release images and restart the stack
        working-directory: /opt/family-os
        env:
          TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -e
          if grep -q '^TAG=' .env; then
            sed -i "s/^TAG=.*/TAG=$TAG/" .env
          else
            echo "TAG=$TAG" >> .env
          fi
          docker compose -f docker-compose.prod.yml --env-file .env pull
          docker compose -f docker-compose.prod.yml --env-file .env up -d
          # -f alone only drops dangling layers, so every superseded release tag
          # stayed on disk (13 images / 11.7 GB before the first sweep). The
          # window keeps the last week of tags available for a TAG= rollback.
          docker image prune -af --filter "until=168h"

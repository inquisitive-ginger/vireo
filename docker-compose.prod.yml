# Production stack for the Pi. Images are built + pushed to GHCR by CI
# (.github/workflows/release.yml); the Pi pulls and runs — it never builds.
# Secrets come from a git-ignored .env alongside this file (see docs/deployment.md
# Part A4). Run: docker compose -f docker-compose.prod.yml --env-file .env up -d
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/inquisitive-ginger/family-os-api:${TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      # Bug-report → GitHub issue bridge (ADR 046). Both optional: unset, the report
      # still saves and only the issue is skipped. Defaulted so compose doesn't warn
      # on a host that hasn't configured the bridge.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
    depends_on:
      postgres: { condition: service_healthy }

  web:
    image: ghcr.io/inquisitive-ginger/family-os-web:${TAG:-latest}
    restart: unless-stopped
    ports:
      - '443:443'
      - '80:80'
    environment:
      APP_HOST: ${APP_HOST}
      CF_API_TOKEN: ${CF_API_TOKEN}
    volumes:
      - caddy_data:/data # persists the issued cert across restarts
    depends_on: [api]

volumes:
  postgres_data:
  caddy_data:
